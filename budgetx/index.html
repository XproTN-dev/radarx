    const icons={overview:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',budget:'<path d="M3 3h18v18H3z"/><path d="M3 9h18M9 9v12"/>',transactions:'<path d="M7 3h14v18H7z"/><path d="M3 7h4M3 12h4M3 17h4M11 8h6M11 13h6"/>',goals:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',settings:'<path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/><circle cx="12" cy="12" r="4"/>',plus:'<path d="M12 5v14M5 12h14"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/>',shield:'<path d="M12 2 20 6v6c0 5-3 8-8 10-5-2-8-5-8-10V6z"/><path d="m9 12 2 2 4-4"/>',wallet:'<rect x="2" y="5" width="20" height="16" rx="3"/><path d="M2 9h20M17 15h2"/>',arrow:'<path d="m7 17 10-10M8 7h9v9"/>',receipt:'<path d="M5 2h14v20l-3-2-4 2-4-2-3 2z"/><path d="M9 7h6M9 12h6"/>',save:'<path d="M4 4h14l3 3v14H3V4z"/><path d="M7 4v6h10V4M7 21v-8h10v8"/>',edit:'<path d="m4 16-.5 4.5L8 20l11-11-4-4zM13 7l4 4"/>',trash:'<path d="M4 7h16M10 7V4h4v3M7 7l1 14h8l1-14"/>',chart:'<path d="M3 20h18M6 16V9M12 16V4M18 16v-5"/>',cloud:'<path d="M7 18H5a4 4 0 0 1 0-8 7 7 0 0 1 13-2 5 5 0 0 1 0 10h-1"/>',check:'<path d="m4 12 5 5L20 6"/>',alert:'<path d="m12 3 10 18H2zM12 9v5m0 3h.01"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 10h18"/>'};
    const svgIcon=(name)=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${icons[name]||icons.chart}</svg>`;
    const esc=(s)=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const money=(n)=>Math.round(Number(n)||0).toLocaleString('en-US');
    const cash=(n)=>`${money(n)} QAR`;
    const bounded=(n,min,max)=>Math.max(min,Math.min(max,n));
    const sum=(xs,fn)=>xs.reduce((n,x)=>n+fn(x),0);
    const identifier=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);
    const now=new Date();let month=new Date(now.getFullYear(),now.getMonth(),1),page='overview';let state=load();let searchValue='',categoryFilter='all',scenarioDelta=0,scenarioMonths=12;
    function cloneDefaults(){return JSON.parse(JSON.stringify(DEFAULTS));}
    function validateData(d){if(!d||typeof d!=='object'||!Array.isArray(d.incomes)||!Array.isArray(d.categories)||!Array.isArray(d.transactions)||!Array.isArray(d.goals))throw Error('Not a valid BudgetX backup.');if([...d.incomes,...d.categories,...d.transactions,...d.goals].length>20000)throw Error('Backup contains too many records.');for(const v of d.incomes){if(!v.id||!v.name||!Number.isFinite(v.amount)||v.amount<0||v.amount>1e9)throw Error('Invalid income entry.')}for(const v of d.categories){if(!v.id||!v.name||!Number.isFinite(v.amount)||v.amount<0||v.amount>1e9||!['fixed','variable'].includes(v.type))throw Error('Invalid budget category.');v.color=/^#[0-9a-fA-F]{6}$/.test(v.color)?v.color:'#7da7ff';v.icon=String(v.icon||'•').slice(0,5)}for(const t of d.transactions){if(!t.id||!t.categoryId||!/^\d{4}-\d{2}-\d{2}$/.test(t.date)||!Number.isFinite(t.amount)||t.amount<=0||t.amount>1e9)throw Error('Invalid transaction.')}for(const g of d.goals){if(!g.id||!g.name||!Number.isFinite(g.target)||g.target<=0||!Number.isFinite(g.current)||g.current<0||!Number.isFinite(g.months)||g.months<1)throw Error('Invalid savings goal.')}return d;}
    function load(){try{let raw=localStorage.getItem(STORAGE_KEY);if(raw)return validateData(JSON.parse(raw));}catch(e){console.warn('Could not load BudgetX data',e);}return cloneDefaults();}
    function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){notify('Could not save data on this browser. Export a backup.',true);}}
    const period=()=>`${month.getFullYear()}-${String(month.getMonth()+1).padStart(2,'0')}`;
    const titleMonth=()=>month.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    const income=()=>sum(state.incomes,x=>x.amount);
    const budget=()=>sum(state.categories,x=>x.amount);
    const fixed=()=>sum(state.categories.filter(x=>x.type==='fixed'),x=>x.amount);
    const savings=()=>income()-budget();
    const transMonth=()=>state.transactions.filter(x=>x.date.slice(0,7)===period());
    const spent=()=>sum(transMonth(),x=>x.amount);
    const spentFor=id=>sum(transMonth().filter(x=>x.categoryId===id),x=>x.amount);
    const category=id=>state.categories.find(x=>x.id===id);
    const percent=(a,b)=>b>0?Math.round(a/b*100):0;
    const dateValue=()=>{let key=period(),today=new Date();return key===`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`?`${key}-${String(today.getDate()).padStart(2,'0')}`:`${key}-01`;};
    const headerMeta={overview:['YOUR MONEY, CLEARER','Overview','Your household finances at a glance.'],budget:['PLAN WITH CONFIDENCE','Budget planner','Adjust your income, expenses, and savings forecast.'],transactions:['SPENDING TRACKER','Transactions','Record real expenses and see where your money goes.'],goals:['MAKE PROGRESS','Savings goals','Turn your monthly surplus into achievable targets.'],settings:['YOUR DATA, YOUR RULES','Settings & backup','Keep your financial data safe, private, and portable.']};
    function setPage(next){page=next;searchValue='';categoryFilter='all';render();window.scrollTo({top:0,behavior:'smooth'});}
    function navItem(key){return `<button class="nav-btn ${key===page?'active':''}" data-nav="${key}" aria-current="${key===page?'page':'false'}">${svgIcon(key)}<span>${({overview:'Overview',budget:'Budget planner',transactions:'Transactions',goals:'Savings goals',settings:'Settings & backup'})[key]}</span></button>`;}
    function navMobile(key){return `<button class="mobile-nav ${key===page?'active':''}" data-nav="${key}" aria-label="${key}">${svgIcon(key)}<span>${({overview:'Overview',budget:'Budget',transactions:'Spending',goals:'Goals',settings:'Settings'})[key]}</span></button>`;}
    function hydrateIcons(){document.querySelectorAll('[data-ico]').forEach(e=>e.innerHTML=svgIcon(e.dataset.ico));}
    function render(){const meta=headerMeta[page];document.getElementById('page-eyebrow').textContent=meta[0];document.getElementById('page-heading').textContent=meta[1];document.getElementById('page-description').textContent=meta[2];document.getElementById('current-month').textContent=titleMonth();document.getElementById('side-nav').innerHTML=['overview','budget','transactions','goals','settings'].map(navItem).join('');document.getElementById('mobile-nav').innerHTML=['overview','budget','transactions','goals','settings'].map(navMobile).join('');document.getElementById('view').innerHTML=({overview:renderOverview,budget:renderBudget,transactions:renderTransactions,goals:renderGoals,settings:renderSettings})[page]();hydrateIcons();setupViewListeners();}
    function kpi(name,val,note,icon,highlight){return `<div class="panel kpi"><div class="kpi-head"><span class="kpi-label">${name}</span><span class="kpi-icon" style="${highlight?'color:var(--mint);background:var(--mint-soft)':''}">${svgIcon(icon)}</span></div><div class="kpi-value ${highlight?'positive':''}">${money(val)}<span class="kpi-unit">QAR</span></div><div class="kpi-note">${note}</div></div>`;}
    function donut(){let groups=[{name:'Fixed bills',value:fixed(),color:'#8d9fff'},{name:'Groceries & food',value:state.categories.filter(c=>c.id==='groceries').reduce((a,c)=>a+c.amount,0),color:'#48e1b0'},{name:'Transport & fuel',value:state.categories.filter(c=>c.id==='fuel').reduce((a,c)=>a+c.amount,0),color:'#6dd2ec'},{name:'Other living costs',value:Math.max(0,budget()-fixed()-state.categories.filter(c=>['groceries','fuel'].includes(c.id)).reduce((a,c)=>a+c.amount,0)),color:'#f5b67d'}];let total=budget();const r=78,circ=2*Math.PI*r;let offset=0;let rings=groups.filter(g=>g.value>0).map(g=>{let len=total?g.value/total*circ:0;let circle=`<circle cx="110" cy="110" r="${r}" fill="none" stroke="${g.color}" stroke-width="20" stroke-dasharray="${Math.max(0,len-2)} ${circ}" stroke-dashoffset="${-offset}" transform="rotate(-90 110 110)"><title>${esc(g.name)}: ${cash(g.value)}</title></circle>`;offset+=len;return circle;}).join('');return `<div class="ring-zone"><svg class="donut" viewBox="0 0 220 220" role="img" aria-label="Planned expenses: ${cash(total)}"><circle cx="110" cy="110" r="${r}" fill="none" stroke="#27374c" stroke-width="20"/>${rings}<text x="110" y="101" text-anchor="middle" fill="#90a3ba" font-size="11">MONTHLY BUDGET</text><text x="110" y="126" text-anchor="middle" fill="#f4f9ff" font-size="25" font-weight="800">${money(total)}</text><text x="110" y="144" text-anchor="middle" fill="#8295ac" font-size="11">QAR</text></svg><div class="legend">${groups.map(g=>`<div class="legend-item"><i class="legend-dot" style="background:${g.color}"></i><span>${g.name}</span><strong>${percent(g.value,total)}%</strong></div>`).join('')}</div></div>`;}
    function forecastChart(){let s=savings();const months=12,points=Array.from({length:months+1},(_,i)=>i*Math.max(0,s));let max=Math.max(1,...points)*1.13;let W=760,H=256,L=65,R=20,T=18,B=36;let x=i=>L+i*(W-L-R)/months,y=v=>H-B-(v/max)*(H-T-B);let hlines=[0,.25,.5,.75,1].map(a=>{let val=max*a;return `<line class="gridline" x1="${L}" x2="${W-R}" y1="${y(val)}" y2="${y(val)}"/><text x="${L-10}" y="${y(val)+4}" text-anchor="end" class="axis-label">${val>=1000?(val/1000).toFixed(val>=10000?0:1)+'k':Math.round(val)}</text>`;}).join('');let pts=points.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');let line=points.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');let area=`${line} L${x(months)},${H-B} L${x(0)},${H-B} Z`;return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Projected savings after 12 months ${cash(s*12)}"><defs><linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#48e1b0" stop-opacity=".26"/><stop offset="1" stop-color="#48e1b0" stop-opacity="0"/></linearGradient></defs>${hlines}<path d="${area}" fill="url(#chartGradient)"/><path d="${line}" stroke="#48e1b0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>${points.filter((_,i)=>i%3===0||i===12).map((v,j)=>{let i= j*3;return `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#48e1b0" stroke="#102638" stroke-width="2"><title>Month ${i}: ${cash(v)}</title></circle>`;}).join('')}${[0,3,6,9,12].map(i=>`<text class="axis-label" x="${x(i)}" y="${H-9}" text-anchor="middle">${i===0?'Now':'Month '+i}</text>`).join('')}</svg>`;}
    function compareBars(){let maximum=Math.max(1,income());return `<div class="bar-compare">${[{name:'Household income',value:income(),color:'var(--blue)'},{name:'Planned expenses',value:budget(),color:'var(--violet)'},{name:'Expected savings',value:Math.max(savings(),0),color:'var(--mint)'}].map(item=>`<div><div class="bar-item-top"><span class="muted">${item.name}</span><strong>${cash(item.value)}</strong></div><div class="bar-track"><div class="bar-fill" style="background:${item.color};width:${bounded(item.value/maximum*100,0,100)}%"></div></div></div>`).join('')}</div>`;}
    function quickBudgetRows(){return [...state.categories].sort((a,b)=>b.amount-a.amount).slice(0,5).map(c=>{let act=spentFor(c.id);return `<div class="budget-row"><div class="cat-name"><span class="cat-symbol" style="background:${esc(c.color)}22;color:${esc(c.color)}">${esc(c.icon||'•')}</span><div><strong>${esc(c.name)}</strong><small>${c.type==='fixed'?'Fixed bill':'Living expense'}</small></div></div><div class="progress-cell"><div class="progress"><div style="width:${bounded(percent(act,c.amount),0,100)}%;background:${act>c.amount?'var(--red)':c.color}"></div></div><small class="subtle tiny">${percent(act,c.amount)}% logged</small></div><div class="cat-values"><strong>${money(c.amount)} QAR</strong><small>${money(act)} spent</small></div><button class="icon-btn" title="Edit category" data-edit-category="${esc(c.id)}">${svgIcon('edit')}</button></div>`;}).join('')}
    function renderOverview(){let save=savings(),rate=percent(save,income()),remaining=budget()-spent(),target=Math.max(save,0);return `<section class="dashboard-top"><div class="panel hero"><div class="hero-content"><span class="pill"><span class="dot"></span> MONTHLY OPPORTUNITY</span><div class="hero-kicker">Your planned savings for ${titleMonth()}</div><div class="hero-value">${money(save)} <span>QAR</span></div><p class="hero-desc">${save>=0?`You could set aside <strong>${rate}% of your household income</strong> if you follow the current budget.`:'Your planned expenses exceed your income. Adjust the budget to avoid a deficit.'} Edit any category to update all the charts instantly.</p><div class="hero-bottom"><button class="btn btn-primary" data-nav="budget">Edit my budget ${svgIcon('arrow')}</button><span class="hero-foot">${cash(target*12)} projected in 12 months</span></div></div></div><div class="panel"><div class="panel-head"><div><h3 class="panel-title">Spending allocation</h3><p class="panel-subtitle">How your planned budget is divided</p></div><span class="pill">${percent(budget(),income())}% of income</span></div>${donut()}</div></section>
      <div class="grid-kpi">${kpi('Household income',income(),`${state.incomes.length} income sources`,'wallet')}${kpi('Planned expenses',budget(),`Includes ${cash(fixed())} fixed bills`,'receipt')}${kpi('Expected savings',save,`${rate}% savings rate`,'arrow',true)}${kpi('Spending logged',spent(),`${money(Math.max(0,remaining))} QAR left in budget`,'chart')}</div>
      <div class="details-grid"><div class="panel"><div class="panel-head"><div><h3 class="panel-title">12-month savings projection</h3><p class="panel-subtitle">Assumes your current monthly budget continues</p></div><strong class="positive small">${cash(save*12)}</strong></div><div class="mini-chart">${save>=0?forecastChart():`<div class="empty"><strong>Not saving at the moment</strong><p>Reduce planned expenses below your income to see a positive savings forecast.</p></div>`}</div></div><div class="panel"><div class="panel-head"><div><h3 class="panel-title">Monthly cash flow</h3><p class="panel-subtitle">How your income is planned to be used</p></div></div>${compareBars()}<div class="inline-stats"><div class="inline-stat"><small>Fixed costs</small><strong>${percent(fixed(),income())}%</strong></div><div class="inline-stat"><small>Living costs</small><strong>${percent(budget()-fixed(),income())}%</strong></div><div class="inline-stat"><small>Savings</small><strong class="${save>=0?'positive':'negative'}">${rate}%</strong></div></div></div></div>
      <div class="details-grid"><div class="panel"><div class="panel-head"><div><h3 class="panel-title">Biggest budget categories</h3><p class="panel-subtitle">Actual spend updates as you log expenses</p></div><button class="btn btn-mini" data-nav="budget">View all</button></div><div class="budget-list">${quickBudgetRows()||'<p class="muted small">Add a budget category to begin.</p>'}</div></div><div class="panel"><div class="panel-head"><div><h3 class="panel-title">Spending tracker</h3><p class="panel-subtitle">Log purchases to compare actual vs planned expenses</p></div><button class="btn btn-mini" data-nav="transactions">View log</button></div><div style="font-size:13px;color:var(--muted);margin-bottom:12px">${transMonth().length} expenses recorded in ${titleMonth()}</div><div class="progress"><div style="width:${bounded(percent(spent(),budget()),0,100)}%;background:${spent()>budget()?'var(--red)':'var(--mint)'}"></div></div><div class="flex-row" style="justify-content:space-between;margin-top:12px"><strong class="small">${cash(spent())} spent</strong><span class="muted small">${cash(Math.max(0,remaining))} budget remaining</span></div><hr class="divider"><div class="callout ${!transMonth().length?'callout-warning':''}"><strong>${!transMonth().length?'No expenses logged yet':'Tracking is in progress'}</strong><br>${!transMonth().length?'Planned bills are NOT automatically treated as paid. Add expenses when you actually pay them.':'Your spending total includes only expenses you have recorded. Add bills and purchases for an accurate comparison.'}</div><button style="margin-top:16px" class="btn btn-primary" data-modal="transaction">${svgIcon('plus')} Log an expense</button></div></div>`;}
    function budgetGroup(type){let cats=state.categories.filter(c=>c.type===type);let total=sum(cats,c=>c.amount);return `<div class="group-heading"><strong>${type==='fixed'?'Fixed monthly bills':'Variable living expenses'}</strong><span>${cash(total)} / month</span></div><div class="stack">${cats.length?cats.map(c=>{let act=spentFor(c.id);return `<div class="source-row"><span class="cat-name"><span class="cat-symbol" style="background:${esc(c.color)}22;color:${esc(c.color)}">${esc(c.icon||'•')}</span><span><span class="name">${esc(c.name)}</span><small>${cash(act)} logged this month</small></span></span><span class="flex-row"><span class="amount">${cash(c.amount)}</span><button class="icon-btn" data-edit-category="${esc(c.id)}" title="Edit">${svgIcon('edit')}</button><button class="icon-btn" data-delete-category="${esc(c.id)}" title="Remove">${svgIcon('trash')}</button></span></div>`;}).join(''):'<p class="small muted">No categories yet.</p>'}</div>`;}
    function incomeRows(){return state.incomes.map(i=>`<div class="source-row"><span><span class="name">${esc(i.name)}</span><small>Monthly income</small></span><span class="flex-row"><span class="amount">${cash(i.amount)}</span><button class="icon-btn" data-edit-income="${esc(i.id)}" title="Edit income">${svgIcon('edit')}</button><button class="icon-btn" data-delete-income="${esc(i.id)}" title="Remove income">${svgIcon('trash')}</button></span></div>`).join('')||'<p class="small muted">Add an income source.</p>';}
    function renderBudget(){return `<div class="grid-kpi">${kpi('Total income',income(),'Monthly household earnings','wallet')}${kpi('Fixed expenses',fixed(),`${state.categories.filter(c=>c.type==='fixed').length} recurring categories`,'receipt')}${kpi('Living budget',budget()-fixed(),'Flexible monthly costs','chart')}${kpi('Available to save',savings(),`${percent(savings(),income())}% of income`,'arrow',true)}</div><div class="planner-layout"><div class="stack"><div class="panel"><div class="panel-head"><div><h3 class="panel-title">Monthly expenses</h3><p class="panel-subtitle">Change any budget amount at any time</p></div><button class="btn btn-mini btn-primary" data-modal="category">${svgIcon('plus')} Add category</button></div>${budgetGroup('fixed')}<hr class="divider">${budgetGroup('variable')}</div></div><div class="stack"><div class="panel"><div class="panel-head"><div><h3 class="panel-title">Income sources</h3><p class="panel-subtitle">Monthly household earnings</p></div><button class="btn btn-mini" data-modal="income">${svgIcon('plus')} Add</button></div>${incomeRows()}</div><div class="panel" id="scenario"><div class="panel-head"><div><h3 class="panel-title">What-if savings calculator</h3><p class="panel-subtitle">Explore a scenario without changing your real budget</p></div></div><label class="slider-line" for="scenario-delta">Extra spending per month <strong id="delta-label">${scenarioDelta>=0?'+':''}${cash(scenarioDelta)}</strong></label><input class="scenario-track" type="range" min="-3000" max="4000" step="100" value="${scenarioDelta}" id="scenario-delta"><label class="slider-line" for="scenario-months">Projection timeframe <strong id="months-label">${scenarioMonths} months</strong></label><input class="scenario-track" type="range" min="3" max="36" step="3" value="${scenarioMonths}" id="scenario-months"><div class="tiny muted" style="margin-top:5px">Projected savings with this scenario</div><div class="scenario-total" id="scenario-total">${cash(savings()-scenarioDelta)}</div><div class="tiny muted">per month</div><div class="scenario-metrics"><div><small>Total over selected period</small><strong id="scenario-future">${cash((savings()-scenarioDelta)*scenarioMonths)}</strong></div><div><small>Savings rate</small><strong id="scenario-rate">${percent(savings()-scenarioDelta,income())}%</strong></div></div><p class="mini-help" style="margin-top:15px">Negative extra spending means you cut expenses. These sliders do not alter saved budget amounts.</p></div></div></div>`;}
    function renderTransactions(){let monthly=transMonth();return `<div class="grid-kpi">${kpi('Monthly budget',budget(),'All planned expense categories','wallet')}${kpi('Expenses logged',spent(),`${monthly.length} recorded expenses`,'receipt')}${kpi('Budget remaining',budget()-spent(),'Planned budget less recorded expenses','arrow',true)}${kpi('Largest single expense',Math.max(0,...monthly.map(t=>t.amount)),'For the selected month','chart')}</div><div class="panel"><div class="panel-head"><div><h3 class="panel-title">Expense ledger</h3><p class="panel-subtitle">Only transactions dated in ${titleMonth()} are shown</p></div><button class="btn btn-primary btn-mini" data-modal="transaction">${svgIcon('plus')} New expense</button></div><div class="filters"><input id="search-tx" aria-label="Search expenses" placeholder="Search description or category..." value="${esc(searchValue)}"><select id="filter-category" aria-label="Filter expense category"><option value="all">All categories</option>${state.categories.map(c=>`<option value="${esc(c.id)}" ${categoryFilter===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><button class="btn btn-mini" id="export-csv">${svgIcon('download')} Export CSV</button></div><div id="tx-list"></div></div><div class="section"><div class="callout"><strong>How this tracker works:</strong> Your salaries and monthly expense budgets are planning figures. The expense ledger includes only amounts you actually log. It does not assume the rent, car installment or other bills have been paid. Use the month navigation above to view past months.</div></div>`;}
    function drawTransactions(){let node=document.getElementById('tx-list');if(!node)return;let filtered=transMonth().filter(t=>{let c=category(t.categoryId);return (categoryFilter==='all'||t.categoryId===categoryFilter)&&(`${t.note||''} ${c?.name||''}`.toLowerCase().includes(searchValue.toLowerCase()));}).sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));if(!filtered.length){node.innerHTML=`<div class="empty"><div class="empty-art">🧾</div><strong>${transMonth().length?'No matching expenses':'No expenses logged for this month'}</strong><p>${transMonth().length?'Try another search term or category.':'Start with your rent, groceries, fuel or any expense you actually paid. Your data will be saved in this browser.'}</p><button class="btn btn-primary btn-mini" data-modal="transaction">${svgIcon('plus')} Add expense</button></div>`;return;}node.innerHTML=`<div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th>Actions</th></tr></thead><tbody>${filtered.map(t=>{let c=category(t.categoryId);return `<tr><td>${esc(t.date)}</td><td><strong>${esc(t.note||'Expense')}</strong></td><td><span class="legend-item"><i class="legend-dot" style="background:${esc(c?.color||'#97a9bd')}"></i>${esc(c?.name||'Deleted category')}</span></td><td><strong>${cash(t.amount)}</strong></td><td><div class="row-actions"><button class="icon-btn" title="Edit" data-edit-tx="${esc(t.id)}">${svgIcon('edit')}</button><button class="icon-btn" title="Delete" data-delete-tx="${esc(t.id)}">${svgIcon('trash')}</button></div></td></tr>`;}).join('')}</tbody></table></div>`;}
    function renderGoals(){return `<div class="panel hero" style="margin-bottom:18px;min-height:0"><div class="hero-content"><span class="pill"><span class="dot"></span> SAVINGS POTENTIAL</span><div class="hero-kicker">A consistent budget can make goals feel achievable</div><div class="hero-value">${cash(Math.max(0,savings()*12))}</div><p class="hero-desc">Projected savings in the next 12 months, before any investment returns and assuming your planned budget stays unchanged.</p><button class="btn btn-primary" data-nav="budget">Adjust forecast ${svgIcon('arrow')}</button></div></div><div class="section-header"><h2 class="section-title">Your savings goals</h2><button class="btn btn-primary" data-modal="goal">${svgIcon('plus')} Add a goal</button></div><div class="goal-grid">${state.goals.map(g=>{let pct=percent(g.current,g.target);let rest=Math.max(0,g.target-g.current);let needed=rest/g.months;return `<div class="panel"><div class="goal-top"><div class="goal-icon">${esc(g.icon||'🎯')}</div><div class="goal-actions"><button class="icon-btn" data-edit-goal="${esc(g.id)}" title="Edit">${svgIcon('edit')}</button><button class="icon-btn" data-delete-goal="${esc(g.id)}" title="Delete">${svgIcon('trash')}</button></div></div><div class="goal-title">${esc(g.name)}</div><div class="goal-sub">${cash(g.current)} saved of ${cash(g.target)}</div><div class="goal-value">${pct}%</div><div class="progress"><div style="width:${bounded(pct,0,100)}%"></div></div><div class="goal-note">${rest<=0?'🎉 Goal achieved!':`${cash(needed)} / month needed over ${g.months} months`}</div></div>`;}).join('')||`<div class="panel empty"><div class="empty-art">🎯</div><strong>No goals added</strong><p>Create your first savings target to track progress.</p><button class="btn btn-primary btn-mini" data-modal="goal">Add a goal</button></div>`}</div><div class="section"><div class="callout"><strong>Helpful guideline:</strong> Your goal balances are entered manually; BudgetX does not connect to any bank. The sum of monthly savings required for your goals should fit within your estimated ${cash(Math.max(0,savings()))} monthly savings capacity.</div></div>`;}
    function renderSettings(){return `<div class="setting-grid"><div class="panel setting-card"><div class="setting-icon">📦</div><h3 class="panel-title">Export complete backup</h3><p>Download a JSON file containing incomes, budget categories, transaction history, and savings goals. Keep a copy to protect against browser data loss.</p><button class="btn btn-primary" id="export-backup">${svgIcon('download')} Download JSON backup</button></div><div class="panel setting-card"><div class="setting-icon">📥</div><h3 class="panel-title">Import a backup</h3><p>Restore a BudgetX JSON backup on another device or browser. Your current data will be replaced after confirmation.</p><button class="btn" id="import-backup">${svgIcon('save')} Import JSON file</button></div><div class="panel setting-card"><div class="setting-icon">🧮</div><h3 class="panel-title">Export expenses to CSV</h3><p>Download all the recorded transactions as a spreadsheet-friendly CSV file. Open it in Excel or Google Sheets.</p><button class="btn" id="export-all-csv">${svgIcon('download')} Download CSV</button></div><div class="panel setting-card danger-zone"><div class="setting-icon">🔄</div><h3 class="panel-title">Reset your budget</h3><p>Restore the empty starter budget. This deletes all recorded transactions and saved goals after confirmation.</p><button class="btn btn-danger" id="reset-data">Reset all data</button></div></div><div class="section panel"><h3 class="panel-title">About BudgetX</h3><p class="panel-subtitle" style="line-height:1.85">BudgetX is a standalone, offline-first HTML app. This public copy starts with no personal financial figures. Use Import JSON to load your private budget. Information is stored in your browser using local storage; it does not sync between devices, access bank accounts, or send any information to a server. Clearing browser site data, switching browsers, or using private mode can delete saved data. Export backups regularly.</p><div class="flex-row" style="margin-top:18px"><span class="pill"><span class="dot"></span> Offline</span><span class="pill"><span class="dot"></span> No login</span><span class="pill"><span class="dot"></span> No external scripts</span></div></div>`;}
    function setupViewListeners(){if(page==='transactions'){drawTransactions();let search=document.getElementById('search-tx'),filter=document.getElementById('filter-category');search?.addEventListener('input',e=>{searchValue=e.target.value;drawTransactions();});filter?.addEventListener('change',e=>{categoryFilter=e.target.value;drawTransactions();});}if(page==='budget'){let delta=document.getElementById('scenario-delta'),months=document.getElementById('scenario-months');delta.addEventListener('input',e=>{scenarioDelta=Number(e.target.value);refreshScenario();});months.addEventListener('input',e=>{scenarioMonths=Number(e.target.value);refreshScenario();});}}
    function refreshScenario(){let result=savings()-scenarioDelta;document.getElementById('delta-label').textContent=`${scenarioDelta>=0?'+':''}${cash(scenarioDelta)}`;document.getElementById('months-label').textContent=scenarioMonths+' months';document.getElementById('scenario-total').textContent=cash(result);document.getElementById('scenario-total').style.color=result<0?'var(--red)':'var(--mint)';document.getElementById('scenario-future').textContent=cash(result*scenarioMonths);document.getElementById('scenario-rate').textContent=percent(result,income())+'%';}
    function notify(text,isError=false){let el=document.getElementById('toast');el.textContent=text;el.className='toast show'+(isError?' error':'');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.remove('show'),3500);}
    function closeModal(){let modal=document.getElementById('modal');modal.classList.remove('show');document.body.style.overflow='';document.getElementById('modal-content').innerHTML='';}
    function openModal(kind,id){let item,heading,fields='';const button=(txt)=>`<div class="form-foot"><button type="button" class="btn" id="cancel-modal">Cancel</button><button type="submit" class="btn btn-primary">${txt}</button></div>`;if(kind==='transaction'){item=state.transactions.find(t=>t.id===id);heading=item?'Edit expense':'Add an expense';fields=`<div class="form-grid"><div class="form-field full"><label for="f-note">Description</label><input name="note" id="f-note" maxlength="100" required placeholder="e.g. Carrefour groceries" value="${esc(item?.note||'')}"></div><div class="form-field"><label for="f-amount">Amount (QAR)</label><input name="amount" id="f-amount" type="number" min="0.01" max="1000000000" step="0.01" required placeholder="0.00" value="${item?.amount??''}"></div><div class="form-field"><label for="f-date">Paid date</label><input name="date" id="f-date" type="date" required value="${esc(item?.date||dateValue())}"></div><div class="form-field full"><label for="f-category">Expense category</label><select name="categoryId" id="f-category" required>${state.categories.map(c=>`<option value="${esc(c.id)}" ${c.id===item?.categoryId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div><p class="mini-help">An entry counts as an actual expense only for the date you choose.</p>${button(item?'Save expense':'Add expense')}`;if(!state.categories.length){notify('Add a budget category first.',true);return;}}
      else if(kind==='category'){item=state.categories.find(c=>c.id===id);heading=item?'Edit budget category':'Add a category';fields=`<div class="form-grid"><div class="form-field full"><label for="f-name">Category name</label><input name="name" id="f-name" maxlength="50" required placeholder="e.g. Health and medical" value="${esc(item?.name||'')}"></div><div class="form-field"><label for="f-amount">Monthly budget (QAR)</label><input name="amount" id="f-amount" type="number" min="0" max="1000000000" step="0.01" required value="${item?.amount??''}"></div><div class="form-field"><label for="f-type">Expense type</label><select name="type" id="f-type"><option value="variable" ${item?.type==='variable'?'selected':''}>Variable living expense</option><option value="fixed" ${item?.type==='fixed'?'selected':''}>Fixed monthly bill</option></select></div><div class="form-field"><label for="f-icon">Emoji / symbol</label><input name="icon" id="f-icon" maxlength="5" value="${esc(item?.icon||'💳')}"></div><div class="form-field"><label for="f-color">Chart color</label><div class="color-preview"><input name="color" id="f-color" type="color" value="${esc(item?.color||'#48e1b0')}"><span class="tiny muted">Choose a color</span></div></div></div>${button(item?'Update category':'Add category')}`;}
      else if(kind==='income'){item=state.incomes.find(i=>i.id===id);heading=item?'Edit income':'Add an income source';fields=`<div class="form-grid"><div class="form-field full"><label for="f-name">Income name</label><input name="name" id="f-name" maxlength="50" required placeholder="e.g. Freelance work" value="${esc(item?.name||'')}"></div><div class="form-field full"><label for="f-amount">Monthly amount (QAR)</label><input name="amount" id="f-amount" type="number" min="0" max="1000000000" step="0.01" required value="${item?.amount??''}"></div></div>${button(item?'Update income':'Add income')}`;}
      else if(kind==='goal'){item=state.goals.find(g=>g.id===id);heading=item?'Edit savings goal':'New savings goal';fields=`<div class="form-grid"><div class="form-field full"><label for="f-name">Goal name</label><input name="name" id="f-name" maxlength="50" required placeholder="e.g. Holiday fund" value="${esc(item?.name||'')}"></div><div class="form-field"><label for="f-target">Target (QAR)</label><input name="target" id="f-target" type="number" min="1" max="1000000000" required value="${item?.target??''}"></div><div class="form-field"><label for="f-current">Already saved (QAR)</label><input name="current" id="f-current" type="number" min="0" max="1000000000" required value="${item?.current??0}"></div><div class="form-field"><label for="f-months">Months to reach target</label><input name="months" id="f-months" type="number" min="1" max="600" step="1" required value="${item?.months??12}"></div><div class="form-field"><label for="f-icon">Goal emoji</label><input name="icon" id="f-icon" maxlength="5" value="${esc(item?.icon||'🎯')}"></div></div>${button(item?'Update goal':'Create goal')}`;}
      else return;document.getElementById('modal-title').textContent=heading;document.getElementById('modal-content').innerHTML=`<form id="edit-form">${fields}</form>`;document.getElementById('modal').classList.add('show');document.body.style.overflow='hidden';document.getElementById('cancel-modal').addEventListener('click',closeModal);document.getElementById('edit-form').addEventListener('submit',e=>{e.preventDefault();const form=new FormData(e.currentTarget),d=Object.fromEntries(form.entries());try{const number=n=>{let v=Number(n);if(!Number.isFinite(v)||v<0||v>1e9)throw Error('Please enter a valid amount.');return Math.round(v*100)/100;};if(kind==='transaction'){let v={id:id||identifier(),note:String(d.note).trim(),amount:number(d.amount),date:d.date,categoryId:d.categoryId};if(v.amount<=0||!v.note||!/^\d{4}-\d{2}-\d{2}$/.test(v.date)||!category(v.categoryId))throw Error('Please complete every expense field.');replaceIn('transactions',v);if(v.date.slice(0,7)!==period())notify('Expense saved to '+v.date.slice(0,7)+'. Switch months to view it.');}if(kind==='income'){let v={id:id||identifier(),name:String(d.name).trim(),amount:number(d.amount)};if(!v.name)throw Error('Please enter an income name.');replaceIn('incomes',v);}if(kind==='category'){let v={id:id||identifier(),name:String(d.name).trim(),amount:number(d.amount),type:d.type,color:d.color,icon:String(d.icon||'•').slice(0,5)};if(!v.name||!['fixed','variable'].includes(v.type))throw Error('Enter a valid category.');replaceIn('categories',v);}if(kind==='goal'){let v={id:id||identifier(),name:String(d.name).trim(),target:number(d.target),current:number(d.current),months:Math.round(number(d.months)),icon:String(d.icon||'🎯').slice(0,5)};if(!v.name||v.target<=0||v.months<1)throw Error('Complete the savings goal fields.');replaceIn('goals',v);}save();closeModal();render();notify('Saved successfully.');}catch(err){notify(err.message||'Could not save.',true);}});setTimeout(()=>document.getElementById(kind==='transaction'?'f-note':'f-name')?.focus(),40);}
    function replaceIn(collection,v){let idx=state[collection].findIndex(e=>e.id===v.id);if(idx<0)state[collection].push(v);else state[collection][idx]=v;}
    function deletion(collection,id){let i=state[collection].find(x=>x.id===id);if(!i)return;let description=collection==='transactions'?i.note:(i.name||'entry');if(collection==='categories'&&state.transactions.some(t=>t.categoryId===id)){notify('Cannot delete a category with recorded expenses. Edit it instead.',true);return;}if(confirm(`Delete "${description}"? This cannot be undone.`)){state[collection]=state[collection].filter(x=>x.id!==id);save();render();notify('Deleted.');}}
    function downloadFile(filename,content,mime){let blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
    function downloadBackup(){downloadFile(`BudgetX-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json');notify('Backup downloaded. Store it safely.');}
    function exportCSV(){let rows=[['Date','Description','Category','Amount QAR'],...state.transactions.sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.note||'',category(t.categoryId)?.name||'Deleted category',t.amount])];let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadFile('BudgetX-expenses.csv','\ufeff'+csv,'text/csv;charset=utf-8');notify('CSV expense ledger exported.');}
    document.addEventListener('click',e=>{let target=e.target.closest('[data-nav],[data-modal],[data-edit-category],[data-delete-category],[data-edit-income],[data-delete-income],[data-edit-tx],[data-delete-tx],[data-edit-goal],[data-delete-goal]');if(target){if(target.dataset.nav)setPage(target.dataset.nav);else if(target.dataset.modal)openModal(target.dataset.modal);else if(target.dataset.editCategory)openModal('category',target.dataset.editCategory);else if(target.dataset.deleteCategory)deletion('categories',target.dataset.deleteCategory);else if(target.dataset.editIncome)openModal('income',target.dataset.editIncome);else if(target.dataset.deleteIncome)deletion('incomes',target.dataset.deleteIncome);else if(target.dataset.editTx)openModal('transaction',target.dataset.editTx);else if(target.dataset.deleteTx)deletion('transactions',target.dataset.deleteTx);else if(target.dataset.editGoal)openModal('goal',target.dataset.editGoal);else if(target.dataset.deleteGoal)deletion('goals',target.dataset.deleteGoal);return;}let t=e.target.closest('button');if(!t)return;if(t.id==='export-backup'||t.id==='quick-export')downloadBackup();if(t.id==='export-csv'||t.id==='export-all-csv')exportCSV();if(t.id==='import-backup')document.getElementById('import-input').click();if(t.id==='reset-data'&&confirm('Reset all budget information? This permanently deletes your expenses and custom goals from this browser.')){state=cloneDefaults();save();render();notify('The original budget has been restored.');}});
    document.getElementById('quick-add').addEventListener('click',()=>openModal('transaction'));
    document.getElementById('prev-month').addEventListener('click',()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render();});
    document.getElementById('next-month').addEventListener('click',()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render();});
    document.getElementById('modal-close').addEventListener('click',closeModal);
    document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
    document.getElementById('import-input').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>5e6)throw Error('Backup file is too large.');let d=validateData(JSON.parse(await f.text()));if(confirm(`Import ${d.categories.length} categories and ${d.transactions.length} expenses? This will replace all your current BudgetX data.`)){state={version:1,incomes:d.incomes,categories:d.categories,transactions:d.transactions,goals:d.goals};save();render();notify('Backup imported successfully.');}}catch(err){notify('Import failed: '+err.message,true);}e.target.value='';});
    render();
  })();
  </script>
</body>
</html>
